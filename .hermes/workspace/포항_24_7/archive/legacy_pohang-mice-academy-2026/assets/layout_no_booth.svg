  <text x="600" y="68" font-family="Noto Sans, Arial" font-size="10" fill="#000" text-anchor="middle">Screen</text>

  <!-- Seating: 5 rows x 10 cols = 50 seats (theater style) -->
  <!-- seat spacing and positions -->
  <g id="seats">
  <!-- rows -->
  <!-- compute positions manually -->
  <!-- row 0 y=160, row spacing 70, col x start 150, col spacing 80 -->
  </g>
  <!-- generate seats -->
  <!-- We'll place seats using small circles with numbers -->
  
  <!-- Seats group generated -->
  <g fill="#FF6B6B" stroke="#8B0000" stroke-width="1">
    <!-- Row 1 -->
    <!-- columns 10 -->
    <!-- Using loop-like manual entries -->
    <!-- Row 0 -->
    <g id="row0">
      <circle cx="150" cy="160" r="12"/>
      <circle cx="230" cy="160" r="12"/>
      <circle cx="310" cy="160" r="12"/>
      <circle cx="390" cy="160" r="12"/>

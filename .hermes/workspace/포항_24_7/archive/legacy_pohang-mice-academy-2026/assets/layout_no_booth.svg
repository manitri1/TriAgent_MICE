<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Room outline (12m x 8m scale, 100px = 1m) -->
  <rect x="5" y="5" width="1190" height="790" fill="#f9f9f9" stroke="#2E3A46" stroke-width="4"/>


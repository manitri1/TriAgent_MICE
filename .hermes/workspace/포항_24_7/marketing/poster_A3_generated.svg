<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420">
  <rect width="100%" height="100%" fill="#F4E7D3"/>
  <!-- Header bar -->
  <rect x="0" y="0" width="297" height="48" fill="#0B72B9"/>
  <text x="148.5" y="30" font-family="Noto Sans, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">POHANG 24/7 — 지역 콘텐츠 발굴 콘테스트</text>

  <!-- Hero image placeholder -->
  <rect x="15" y="60" width="267" height="150" fill="#e0eef9" stroke="#c0dff4" stroke-width="0.3"/>
  <text x="148.5" y="135" font-family="Noto Sans, Arial, sans-serif" font-size="10" fill="#0B72B9" text-anchor="middle">Hero image / 포항 풍경 이미지 (placeholder)</text>

  <!-- Title -->
  <text x="20" y="235" font-family="Noto Sans, Arial, sans-serif" font-size="28" fill="#0B72B9" font-weight="800">포항 지역 콘텐츠 발굴 콘테스트</text>
  <text x="20" y="255" font-family="Noto Sans, Arial, sans-serif" font-size="14" fill="#333">지역 관광지 발굴 아이디어 공모전</text>

  <!-- Date and venue -->
  <g transform="translate(20,270)">
    <text x="0" y="0" font-family="Noto Sans, Arial, sans-serif" font-size="12" fill="#333">일시: 2026.11.03 (화) 18:00</text>
    <text x="0" y="16" font-family="Noto Sans, Arial, sans-serif" font-size="12" fill="#333">장소: 파랑뜰 2층 드림홀</text>
  </g>

  <!-- CTA and QR -->
  <rect x="200" y="270" width="82" height="82" fill="#ffffff" stroke="#ccc" stroke-width="0.3"/>
  <text x="241" y="312" font-family="Noto Sans, Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">QR CODE</text>
  <rect x="20" y="300" width="160" height="1" fill="#ddd"/>
  <text x="20" y="320" font-family="Noto Sans, Arial, sans-serif" font-size="12" fill="#FF6B6B">지금 접수하기 → QR 스캔 또는 링크</text>

  <!-- Footer -->
  <g transform="translate(0,380)">
    <rect x="0" y="0" width="297" height="40" fill="#ffffff"/>
    <text x="20" y="24" font-family="Noto Sans, Arial, sans-serif" font-size="9" fill="#666">주최: 포항 콘텐츠 발굴 운영팀 ｜ 문의: example@pohang.kr ｜ 접수마감: 2026-10-20</text>
  </g>
</svg>

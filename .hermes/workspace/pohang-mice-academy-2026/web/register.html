<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register - Pohang MICE Academy 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <h1>   </h1>
    <h2> </h2>

    <form id="register" action="#" method="post" enctype="multipart/form-data">
      <label>팀명 / 개인명<br><input type="text" name="team" required></label>
      <label>대표자 이름<br><input type="text" name="lead" required></label>
      <label>연락처(휴대폰)<br><input type="tel" name="phone" required></label>
      <label>이메일<br><input type="email" name="email" required></label>
      <label>소속(학교/기관)<br><input type="text" name="affiliation"></label>
      <label>발표 제목<br><input type="text" name="title" required></label>
      <label>발표 요약(200~300자)<br><textarea name="summary" rows="5" required></textarea></label>
      <label>제출 파일(PDF/PPT, max 10MB)<br><input type="file" name="file" accept=".pdf,.ppt,.pptx"></label>

      <p><small>이 페이지는 시연용입니다. 실제 제출은 안내된 구글폼/접수폼을 통해 진행됩니다.</small></p>
      <button class="btn" type="submit">제출(시연)</button>
    </form>

    <p style="margin-top:18px"><a href="index.html">◀ 홈으로 돌아가기</a></p>
  </div>
</body>
</html>

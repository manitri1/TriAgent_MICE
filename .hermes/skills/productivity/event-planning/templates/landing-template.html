<!-- landing-template.html
  Usage: copy into a static site and replace FORM_EMBED_SRC with the Google Form's embed URL
-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Event Landing — Registration</title>
  <meta name="description" content="Event landing page. Replace FORM_EMBED_SRC with your Google Form embed URL.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Event title here</h1>
      <p class="kicker">YYYY-MM-DD | Venue</p>
    </div>
  </header>

  <main class="container main-card">
    <section class="summary">
      <h2>About</h2>
      <p>Short description of the event and call-to-action.</p>
    </section>

    <section class="cta">
      <h2>Register</h2>
      <!-- Replace the src with Google Form embed URL: use forms > Send > Embed HTML -->
      <iframe src="FORM_EMBED_SRC" width="100%" height="800" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
      <p class="small">If the form does not load, use this link: <a href="FORM_URL">Register here</a></p>
    </section>

    <section class="info">
      <h3>Contact</h3>
      <p>Email: contact@example.com</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><small>© Event organizer</small></div>
  </footer>
</body>
</html>
